<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    div.container{
        display: flex;
        width: 400px;
        height: 400px;
        background-color: #b3c1dd;
        flex-wrap: wrap;
        flex-direction: row-reverse;
    }
    .container > div{
        width:100px;
        height: 100px;
        background-color: rgb(226,131,131);
        border-radius: 7px;
        border: 1px solid rgb(148,50,50)
    }

    </style>
</head>
<body>
 <div class="container">
    <div>Item 1</div>
    <div>Item 2</div>
    <div>Item 3</div>
 </div>    
</body>
</html>
